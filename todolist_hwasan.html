<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화산파 수련 일지 | Mount Hua Sect To-Do</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif KR"', 'serif'],
          },
          colors: {
            plum: {
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              800: '#9f1239',
              900: '#881337',
            },
            ink: '#111111',
            paper: '#fafaf9',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #1a1a1a;
      color: #e5e5e5;
      overflow-x: hidden;
    }
    
    /* 붓글씨 먹물 그림자 효과 */
    .ink-shadow {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(225, 29, 72, 0.3);
    }
    
    .border-ink {
      border: 2px solid #333;
      box-shadow: 2px 2px 0px #000, -1px -1px 0px #444;
    }

    /* 매화검기 베기 애니메이션 */
    @keyframes plumSlash {
      0% { transform: scaleX(0) rotate(-2deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: scaleX(1.1) rotate(-2deg); opacity: 0.8; }
    }

    .slash-effect {
      position: relative;
    }
    
    .slash-effect::after {
      content: '';
      position: absolute;
      top: 50%;
      left: -5%;
      width: 110%;
      height: 4px;
      background: linear-gradient(90deg, transparent, #fb7185, #e11d48, #fb7185, transparent);
      box-shadow: 0 0 12px #f43f5e, 0 0 4px #fff;
      transform-origin: left center;
      animation: plumSlash 0.3s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      pointer-events: none;
      z-index: 10;
    }

    /* 완료된 항목 흐리게 */
    .task-completed {
      opacity: 0.6;
      filter: grayscale(0.4);
      transition: all 0.3s ease;
    }

    /* 드래그 앤 드롭 스타일 */
    .draggable {
      cursor: grab;
    }
    .draggable:active {
      cursor: grabbing;
    }
    .drag-over {
      border-top: 2px dashed #fb7185 !important;
      opacity: 0.7;
    }

    /* 캔버스 배경 */
    #plumCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: -1;
    }
    
    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #881337; border-radius: 4px; }
  </style>
</head>
<body class="font-serif min-h-screen relative flex flex-col items-center py-10 px-4">

  <!-- 매화꽃 흩날리는 캔버스 -->
  <canvas id="plumCanvas"></canvas>

  <div class="w-full max-w-2xl z-10 relative">
    
    <!-- 화산파 매화문양 배경 워터마크 (SVG) -->
    <svg viewBox="0 0 100 100" class="absolute top-40 left-1/2 -translate-x-1/2 w-96 h-96 opacity-[0.07] pointer-events-none -z-10" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="plumGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f43f5e" />
          <stop offset="100%" stop-color="#9f1239" />
        </radialGradient>
      </defs>
      <!-- 매화 5개의 꽃잎과 암술/수술 묘사 -->
      <g fill="url(#plumGrad)" transform="translate(50, 50) scale(1.1)">
        <circle cx="0" cy="-25" r="20" />
        <circle cx="24" cy="-8" r="20" />
        <circle cx="15" cy="20" r="20" />
        <circle cx="-15" cy="20" r="20" />
        <circle cx="-24" cy="-8" r="20" />
        <circle cx="0" cy="0" r="15" fill="#1a1a1a"/>
        <path d="M0,0 L0,-15 M0,0 L14,-4 M0,0 L9,12 M0,0 L-9,12 M0,0 L-14,-4" stroke="#f43f5e" stroke-width="2"/>
        <circle cx="0" cy="0" r="4" fill="#f43f5e"/>
      </g>
    </svg>

    <!-- 헤더 & 타이틀 -->
    <header class="text-center mb-8 bg-black/50 p-6 rounded-xl border-ink backdrop-blur-sm relative">
      <!-- 상단 컨트롤: 음향 토글 및 현재 계급 배지 -->
      <div class="flex justify-between items-center mb-4 relative z-10">
        <button onclick="toggleSound()" class="flex items-center gap-2 bg-stone-900 border border-stone-700 hover:border-plum-500 px-3 py-1.5 rounded-full text-xs text-stone-300 transition-all cursor-pointer">
          <span>음향:</span>
          <span id="soundStatus" class="text-plum-400 font-bold">ON</span>
        </button>

        <div class="flex items-center gap-2 bg-stone-900 border border-plum-800/80 px-4 py-1.5 rounded-full text-xs shadow-[0_0_10px_rgba(225,29,72,0.2)]">
          <span class="text-stone-400">현재 경지:</span>
          <span id="rankDisplay" class="text-plum-400 font-black text-sm tracking-wider">평제자</span>
        </div>
      </div>

      <!-- 수련생 고유 식별패 (클라우드 동기화 상태) -->
      <div class="text-[11px] text-stone-500 font-mono mb-3 text-right">
        수련패 식별자: <span id="userBadge" class="text-stone-400">동기화 연결 중...</span>
      </div>

      <div class="flex items-center justify-center gap-4 mb-2 relative z-10">
        <span class="text-plum-600 text-3xl">✿</span>
        <h1 class="text-4xl md:text-5xl font-black text-white ink-shadow tracking-widest">華山派 修練日誌</h1>
        <span class="text-plum-600 text-3xl">✿</span>
      </div>
      <p class="text-stone-300 text-sm mt-2 relative z-10">대화산파(大華山派) 매화검수의 임무를 기록하라</p>

      <!-- 화산신룡 청명 프로필 섹션 -->
      <div class="mt-8 mb-4 mx-auto max-w-lg flex flex-col sm:flex-row items-center sm:items-start justify-center gap-4 sm:gap-6 p-5 rounded-xl bg-gradient-to-br from-stone-900 via-stone-800 to-stone-950 border border-stone-700 shadow-[0_4px_20px_rgba(225,29,72,0.2)] relative overflow-hidden z-10">
        <!-- 붉은 매화 장식선 -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-plum-500 to-transparent opacity-60"></div>
        
        <!-- 캐릭터 아바타 (src 속성을 원하는 캐릭터 이미지 주소로 교체하시면 됩니다) -->
        <div class="relative w-24 h-24 sm:w-28 sm:h-28 flex-shrink-0 rounded-full border-2 border-plum-600 shadow-[0_0_15px_rgba(225,29,72,0.5)] overflow-hidden bg-stone-950 flex items-center justify-center group">
          <img id="characterAvatar" 
               src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23111'/%3E%3Ccircle cx='50' cy='50' r='40' fill='%23881337' opacity='0.3'/%3E%3Ctext x='50' y='55' font-size='32' fill='%23f43f5e' text-anchor='middle' dominant-baseline='middle' font-family='serif' font-weight='bold'%3E靑明%3C/text%3E%3C/svg%3E" 
               alt="청명 이미지" 
               class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110 cursor-pointer"
               title="이미지를 교체하려면 HTML 코드 내의 src 주소를 수정하세요">
        </div>

        <!-- 텍스트 정보 -->
        <div class="text-center sm:text-left flex-1 mt-2 sm:mt-0">
          <p class="text-plum-400 text-xs font-bold tracking-wider mb-1 drop-shadow-[0_0_5px_rgba(225,29,72,0.5)]">화산파(華山派) 십삼대제자(十三代弟子)</p>
          <h2 class="text-2xl md:text-3xl font-black text-white ink-shadow mb-1 flex flex-col sm:flex-row items-center sm:items-end gap-1 sm:gap-2">
            화산신룡 청명
            <span class="text-stone-500 text-sm font-normal pb-1 tracking-widest">華山神龍</span>
          </h2>
          <p class="text-stone-400 text-sm italic border-t sm:border-t-0 sm:border-l-2 border-plum-800 pt-3 sm:pt-0 sm:pl-3 mt-3 sm:mt-2 font-light break-keep">
            "내 화산을 다시 천하제일문으로 만들어주마."
          </p>
        </div>
      </div>

      <!-- 계급 진척도 바 -->
      <div class="mt-6 w-full bg-stone-800 rounded-full h-3 border border-stone-700 relative overflow-hidden z-10">
        <div id="rankProgressBar" class="bg-gradient-to-r from-plum-900 to-plum-500 h-3 rounded-full transition-all duration-700 w-0 shadow-[0_0_10px_#e11d48]"></div>
      </div>
      <p id="rankProgressText" class="text-xs text-stone-400 mt-2 text-right">완수: 0 / 다음 경지: 5</p>
    </header>

    <!-- 임무 하달 (입력창) -->
    <div class="flex gap-2 mb-6 shadow-lg shadow-plum-900/20">
      <input type="text" id="taskInput" 
        class="flex-1 bg-stone-900 border-2 border-stone-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-plum-500 focus:ring-1 focus:ring-plum-500 transition-all font-bold placeholder-stone-600" 
        placeholder="새로운 수련 임무를 하달받습니다..."
        onkeypress="handleKeyPress(event)">
      <button onclick="addTask()" 
        class="bg-gradient-to-b from-plum-600 to-plum-900 text-white px-6 py-3 rounded-lg font-bold border-2 border-plum-900 hover:from-plum-500 hover:to-plum-800 transition-all shadow-[0_0_15px_rgba(225,29,72,0.4)] whitespace-nowrap">
        명 받들기
      </button>
    </div>

    <!-- 임무 목록 -->
    <ul id="taskList" class="space-y-3">
      <!-- 동적으로 추가되는 목록 -->
    </ul>
    
    <!-- 비었을 때 메시지 -->
    <div id="emptyMessage" class="text-center py-12 text-stone-500 hidden">
      <p class="text-lg">현재 하달된 임무가 없습니다.</p>
      <p class="text-sm mt-2">수련을 게을리하지 마십시오.</p>
    </div>

  </div>

  <!-- 데이터 영구 보존 및 클라우드 연동 모듈 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- 기본 상태 관리 ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'to-dolisthwasan';
    let db = null;
    let auth = null;
    let user = null;
    let userId = null;

    let tasks = [
      { id: 'mock1', text: '매화검법(梅花劍法) 1초식 수련', completed: false, order: 0 },
      { id: 'mock2', text: '연무장 바닥 쓸고 물 긷기', completed: false, order: 1 },
      { id: 'mock3', text: '청명 사형 피해서 도망치기', completed: false, order: 2 },
      { id: 'mock4', text: '낙양(洛陽) 은하상단 호위 임무', completed: false, order: 3 }
    ];
    let soundEnabled = true;
    let completedTotalCount = 0;

    // 화산파 계급 시스템
    const ranks = [
      { name: '평제자', req: 0 },
      { name: '삼대제자', req: 3 },
      { name: '이대제자', req: 8 },
      { name: '일대제자', req: 15 },
      { name: '장로', req: 25 },
      { name: '장문인', req: 40 }
    ];

    // --- Web Audio API (매화검기 효과음) ---
    let audioCtx = null;

    function playSlashSound() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {
        console.log("오디오 재생 불가:", e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const statusSpan = document.getElementById('soundStatus');
      if (statusSpan) {
        if (soundEnabled) {
          statusSpan.innerText = 'ON';
          statusSpan.className = 'text-plum-400 font-bold';
        } else {
          statusSpan.innerText = 'OFF';
          statusSpan.className = 'text-stone-500 font-bold';
        }
      }
    }

    // --- 브라우저 자체 영구 보존 엔진 (IndexedDB) ---
    const DB_NAME = 'HwasanTodoDB';
    const DB_VERSION = 1;
    let localDB = null;

    function initLocalDatabase() {
      return new Promise((resolve) => {
        if (!window.indexedDB) {
          resolve(null);
          return;
        }
        const request = window.indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains('tasks')) {
            dbInstance.createObjectStore('tasks', { keyPath: 'id' });
          }
          if (!dbInstance.objectStoreNames.contains('stats')) {
            dbInstance.createObjectStore('stats', { keyPath: 'key' });
          }
        };
        request.onsuccess = (e) => {
          localDB = e.target.result;
          resolve(localDB);
        };
        request.onerror = () => {
          resolve(null);
        };
      });
    }

    function loadFromLocalDatabase() {
      return new Promise((resolve) => {
        if (!localDB) {
          resolve(false);
          return;
        }
        try {
          const tx = localDB.transaction(['tasks', 'stats'], 'readonly');
          const taskStore = tx.objectStore('tasks');
          const statsStore = tx.objectStore('stats');

          const tasksReq = taskStore.getAll();
          const statsReq = statsStore.get('completedTotalCount');

          tx.oncomplete = () => {
            let hasLoadedData = false;
            if (tasksReq.result && tasksReq.result.length > 0) {
              tasks = tasksReq.result;
              tasks.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
              hasLoadedData = true;
            }
            if (statsReq.result && typeof statsReq.result.val === 'number') {
              completedTotalCount = statsReq.result.val;
            }
            resolve(hasLoadedData);
          };
          tx.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    }

    function saveLocalTask(task) {
      if (!localDB) return;
      try {
        const tx = localDB.transaction('tasks', 'readwrite');
        tx.objectStore('tasks').put(task);
      } catch (e) {}
    }

    function deleteLocalTask(id) {
      if (!localDB) return;
      try {
        const tx = localDB.transaction('tasks', 'readwrite');
        tx.objectStore('tasks').delete(id);
      } catch (e) {}
    }

    function saveAllLocalTasks() {
      if (!localDB) return;
      try {
        const tx = localDB.transaction('tasks', 'readwrite');
        const store = tx.objectStore('tasks');
        store.clear();
        tasks.forEach(t => store.put(t));
      } catch (e) {}
    }

    function saveLocalStats() {
      if (!localDB) return;
      try {
        const tx = localDB.transaction('stats', 'readwrite');
        tx.objectStore('stats').put({ key: 'completedTotalCount', val: completedTotalCount });
      } catch (e) {}
    }

    // --- 클라우드 & 로컬 통합 스토리지 초기화 ---
    async function initStorage() {
      const userBadge = document.getElementById('userBadge');
      
      // 1. 브라우저 영구 보존 엔진 초기화 및 기존 수련 일지 복원
      await initLocalDatabase();
      const hasSavedData = await loadFromLocalDatabase();

      if (!hasSavedData) {
        // 첫 방문 시 기본 임무를 브라우저에 저장
        saveAllLocalTasks();
        saveLocalStats();
      }

      renderTasks();
      updateEmptyMessage();
      updateRank();

      // 2. 외부 배포 환경(GitHub Pages)인 경우 안내 배지 표시
      if (typeof __firebase_config === 'undefined') {
        if (userBadge) {
          userBadge.innerText = '수련생 처소 (브라우저 영구 보존 중)';
        }
        return;
      }

      // 3. 클라우드 설정이 존재하는 환경일 경우 실시간 클라우드 동기화 수행
      try {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        user = auth.currentUser;
        userId = user ? user.uid : crypto.randomUUID();
        if (userBadge) {
          userBadge.innerText = userId;
        }

        const tasksCol = collection(db, 'artifacts', appId, 'users', userId, 'tasks');
        const tasksQuery = query(tasksCol);

        onSnapshot(tasksQuery, async (snapshot) => {
          if (snapshot.empty) {
            for (let i = 0; i < tasks.length; i++) {
              const item = tasks[i];
              const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tasks', item.id);
              await setDoc(docRef, item);
            }
          } else {
            const fetched = [];
            snapshot.forEach((snap) => fetched.push(snap.data()));
            fetched.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
            tasks = fetched;
            saveAllLocalTasks();
            renderTasks();
            updateEmptyMessage();
          }
        }, (err) => console.error("클라우드 임무 동기화 실패:", err));

        const statsDocRef = doc(db, 'artifacts', appId, 'users', userId, 'profile', 'stats');
        onSnapshot(statsDocRef, (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            if (typeof data.completedTotalCount === 'number') {
              completedTotalCount = data.completedTotalCount;
              saveLocalStats();
              updateRank();
            }
          }
        }, (err) => console.error("클라우드 경지 동기화 실패:", err));

      } catch (err) {
        console.warn("클라우드 연동 건너뜀 (로컬 영구 모드로 동작):", err);
        if (userBadge) userBadge.innerText = '수련생 처소 (브라우저 영구 보존 중)';
      }
    }

    // --- 할 일(임무) 조작 로직 ---
    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;

      const newTask = {
        id: generateId(),
        text: text,
        completed: false,
        order: tasks.length > 0 ? Math.min(...tasks.map(t => t.order ?? 0)) - 1 : 0
      };

      tasks.unshift(newTask);
      input.value = '';
      renderTasks();
      updateEmptyMessage();

      // 브라우저 영구 보존
      saveLocalTask(newTask);

      // 클라우드 저장
      if (user && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tasks', newTask.id);
          await setDoc(docRef, newTask);
        } catch (err) {
          console.error("클라우드 임무 저장 실패:", err);
        }
      }
    }

    async function toggleTask(id) {
      const taskIndex = tasks.findIndex(t => t.id === id);
      if (taskIndex === -1) return;

      const task = tasks[taskIndex];
      const isCompleting = !task.completed;
      task.completed = isCompleting;

      const li = document.getElementById(`task-${id}`);
      if (li) {
        if (isCompleting) {
          playSlashSound();
          completedTotalCount++;
          updateRank();
          const textSpan = li.querySelector('.task-text');
          if (textSpan) textSpan.classList.add('slash-effect');
          li.classList.add('task-completed');
        } else {
          const textSpan = li.querySelector('.task-text');
          if (textSpan) textSpan.classList.remove('slash-effect');
          li.classList.remove('task-completed');
          completedTotalCount = Math.max(0, completedTotalCount - 1);
          updateRank();
        }

        const checkbox = li.querySelector('.custom-checkbox');
        if (checkbox) {
          if (isCompleting) {
            checkbox.innerHTML = '<span class="text-plum-400">✿</span>';
            checkbox.classList.add('border-plum-500');
          } else {
            checkbox.innerHTML = '';
            checkbox.classList.remove('border-plum-500');
          }
        }
      }

      // 브라우저 영구 보존
      saveLocalTask(task);
      saveLocalStats();

      // 클라우드 저장
      if (user && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tasks', id);
          await updateDoc(docRef, { completed: task.completed });

          const statsRef = doc(db, 'artifacts', appId, 'users', userId, 'profile', 'stats');
          await setDoc(statsRef, { completedTotalCount }, { merge: true });
        } catch (err) {
          console.error("클라우드 임무 갱신 실패:", err);
        }
      }
    }

    async function deleteTask(id) {
      const li = document.getElementById(`task-${id}`);
      if (li) {
        li.style.transform = 'scale(0.9)';
        li.style.opacity = '0';
      }
      
      setTimeout(async () => {
        tasks = tasks.filter(t => t.id !== id);
        renderTasks();
        updateEmptyMessage();

        // 브라우저 영구 삭제
        deleteLocalTask(id);

        // 클라우드 삭제
        if (user && db) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tasks', id);
            await deleteDoc(docRef);
          } catch (err) {
            console.error("클라우드 임무 삭제 실패:", err);
          }
        }
      }, 200);
    }

    async function syncOrders() {
      // 브라우저 순서 보존
      saveAllLocalTasks();

      // 클라우드 순서 보존
      if (!user || !db) return;
      try {
        for (let i = 0; i < tasks.length; i++) {
          tasks[i].order = i;
          const docRef = doc(db, 'artifacts', appId, 'users', userId, 'tasks', tasks[i].id);
          await updateDoc(docRef, { order: i });
        }
      } catch (err) {
        console.error("순서 동기화 실패:", err);
      }
    }

    function moveTask(index, direction) {
      if (direction === -1 && index > 0) {
        [tasks[index - 1], tasks[index]] = [tasks[index], tasks[index - 1]];
      } else if (direction === 1 && index < tasks.length - 1) {
        [tasks[index + 1], tasks[index]] = [tasks[index], tasks[index + 1]];
      }
      renderTasks();
      syncOrders();
    }

    // --- 드래그 앤 드롭 로직 ---
    let draggedIndex = null;

    function handleDragStart(e, index) {
      draggedIndex = index;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/html', e.target.parentNode);
      setTimeout(() => e.target.style.opacity = '0.5', 0);
    }

    function handleDragOver(e, index) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }

    function handleDrop(e, index) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      
      if (draggedIndex !== null && draggedIndex !== index) {
        const itemToMove = tasks.splice(draggedIndex, 1)[0];
        tasks.splice(index, 0, itemToMove);
        renderTasks();
        syncOrders();
      }
      draggedIndex = null;
    }

    function handleDragEnd(e) {
      e.target.style.opacity = '1';
      document.querySelectorAll('li').forEach(el => el.classList.remove('drag-over'));
    }

    // --- 계급 및 진행도 업데이트 ---
    function updateRank() {
      let currentRank = ranks[0];
      let nextRank = ranks[1];
      let rankIndex = 0;

      for (let i = 0; i < ranks.length; i++) {
        if (completedTotalCount >= ranks[i].req) {
          currentRank = ranks[i];
          rankIndex = i;
          nextRank = ranks[i + 1] || null;
        } else {
          break;
        }
      }

      const rankDisplay = document.getElementById('rankDisplay');
      if (rankDisplay) {
        rankDisplay.innerText = currentRank.name;
      }
      
      const progressText = document.getElementById('rankProgressText');
      const progressBar = document.getElementById('rankProgressBar');

      if (progressBar && progressText) {
        if (nextRank) {
          const prevReq = ranks[rankIndex].req;
          const nextReq = nextRank.req;
          const currentProgress = completedTotalCount - prevReq;
          const requiredForNext = nextReq - prevReq;
          const percentage = (currentProgress / requiredForNext) * 100;
          progressBar.style.width = `${percentage}%`;
          progressText.innerText = `완수: ${completedTotalCount} / 다음 경지(${nextRank.name}): ${nextRank.req}`;
        } else {
          progressBar.style.width = '100%';
          progressBar.classList.replace('from-plum-900', 'from-yellow-600');
          progressBar.classList.replace('to-plum-500', 'to-yellow-300');
          progressText.innerText = `완수: ${completedTotalCount} / 화산의 정점에 올랐습니다.`;
        }
      }
    }

    // --- 화면 렌더링 ---
    function renderTasks() {
      const list = document.getElementById('taskList');
      if (!list) return;
      list.innerHTML = '';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.id = `task-${task.id}`;
        li.className = `draggable flex items-center gap-3 p-4 bg-stone-900 border-2 border-stone-800 rounded-lg transition-all ${task.completed ? 'task-completed' : 'hover:border-stone-600'}`;
        li.draggable = true;
        
        li.addEventListener('dragstart', (e) => handleDragStart(e, index));
        li.addEventListener('dragover', (e) => handleDragOver(e, index));
        li.addEventListener('dragleave', handleDragLeave);
        li.addEventListener('drop', (e) => handleDrop(e, index));
        li.addEventListener('dragend', handleDragEnd);

        li.innerHTML = `
          <button onclick="toggleTask('${task.id}')" 
            class="custom-checkbox w-7 h-7 flex-shrink-0 flex items-center justify-center rounded border-2 border-stone-600 bg-stone-950 transition-colors">
            ${task.completed ? '<span class="text-plum-400 leading-none">✿</span>' : ''}
          </button>
          
          <div class="flex-1 overflow-hidden cursor-pointer" onclick="toggleTask('${task.id}')">
            <span class="task-text text-lg inline-block break-all ${task.completed ? 'slash-effect' : ''}">${escapeHtml(task.text)}</span>
          </div>

          <div class="flex items-center gap-1 opacity-60 hover:opacity-100 transition-opacity">
            <div class="flex flex-col gap-1 mr-2">
              <button onclick="moveTask(${index}, -1)" class="p-1 text-stone-500 hover:text-white bg-stone-800 rounded text-xs" title="위로" ${index === 0 ? 'disabled class="opacity-30"' : ''}>▲</button>
              <button onclick="moveTask(${index}, 1)" class="p-1 text-stone-500 hover:text-white bg-stone-800 rounded text-xs" title="아래로" ${index === tasks.length - 1 ? 'disabled class="opacity-30"' : ''}>▼</button>
            </div>
            <button onclick="deleteTask('${task.id}')" class="px-3 py-2 bg-red-950/50 text-red-400 border border-red-900/50 rounded hover:bg-red-900 hover:text-white transition-colors text-sm font-bold">
              파기
            </button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    function updateEmptyMessage() {
      const msg = document.getElementById('emptyMessage');
      if (!msg) return;
      if (tasks.length === 0) {
        msg.classList.remove('hidden');
      } else {
        msg.classList.add('hidden');
      }
    }

    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // --- 캔버스 매화꽃 애니메이션 ---
    const canvas = document.getElementById('plumCanvas');
    const ctx = canvas ? canvas.getContext('2d') : null;
    let particles = [];
    const particleCount = 40;

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class PlumPetal {
      constructor() {
        this.reset();
        this.y = Math.random() * (canvas ? canvas.height : 500);
      }

      reset() {
        this.x = Math.random() * (canvas ? canvas.width : 500);
        this.y = -20;
        this.size = Math.random() * 5 + 3;
        this.speedY = Math.random() * 1.5 + 0.5;
        this.speedX = (Math.random() - 0.5) * 1;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = (Math.random() - 0.5) * 2;
        this.opacity = Math.random() * 0.5 + 0.3;
      }

      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y * 0.01) + this.speedX;
        this.rotation += this.rotationSpeed;

        if (canvas && (this.y > canvas.height + 20 || this.x < -20 || this.x > canvas.width + 20)) {
          this.reset();
        }
      }

      draw() {
        if (!ctx) return;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = this.opacity;
        
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#f43f5e';
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(0, 0, this.size * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = '#fda4af';
        ctx.fill();
        
        ctx.restore();
      }
    }

    function initCanvas() {
      if (!canvas) return;
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      for (let i = 0; i < particleCount; i++) {
        particles.push(new PlumPetal());
      }
      animateCanvas();
    }

    function animateCanvas() {
      if (!ctx || !canvas) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateCanvas);
    }

    // 전역 바인딩
    window.addTask = addTask;
    window.toggleTask = toggleTask;
    window.deleteTask = deleteTask;
    window.moveTask = moveTask;
    window.toggleSound = toggleSound;
    window.handleKeyPress = handleKeyPress;

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      initCanvas();
      initStorage();
    });
  </script>
</body>
</html>
